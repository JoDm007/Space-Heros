<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Space Heroes</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="favicon.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#02040c" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/ui/dashboard.css" />
  <link rel="stylesheet" href="./src/ui/hub.css" />
  <link rel="stylesheet" href="./src/ui/gameplay.css" />
</head>
<body>
  <!-- Filtres SVG pour les modes daltoniens (aucun coût rendu) -->
  <svg class="sh-cvd-filters" aria-hidden="true" focusable="false">
    <defs>
      <filter id="sh-deuteranopia">
        <feColorMatrix type="matrix" values="0.625 0.375 0 0 0  0.7 0.3 0 0 0  0 0.3 0.7 0 0  0 0 0 1 0"/>
      </filter>
      <filter id="sh-protanopia">
        <feColorMatrix type="matrix" values="0.567 0.433 0 0 0  0.558 0.442 0 0 0  0 0.242 0.758 0 0  0 0 0 1 0"/>
      </filter>
      <filter id="sh-tritanopia">
        <feColorMatrix type="matrix" values="0.95 0.05 0 0 0  0 0.433 0.567 0 0  0 0.475 0.525 0 0  0 0 0 1 0"/>
      </filter>
    </defs>
  </svg>
  <div id="app">
    <section id="vue3d" aria-label="Vue mission"></section>
    <div class="hud-fx" aria-hidden="true"></div>
    <header id="dashboard"></header>
    <aside id="astra"></aside>
    <main id="episode"></main>
    <p class="hud-hint" id="cam-hint">Glisser · WASD · molette pour explorer</p>
    <button type="button" id="btn-audio" class="hud-audio" aria-pressed="true" title="Couper le son">SON</button>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
